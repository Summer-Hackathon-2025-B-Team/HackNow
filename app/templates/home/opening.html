{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>HACK-NOW</title>
        <style>
            body {
                margin: 0;
                background-color: #353A40;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh; /* 全画面 */
            }

            .fade-in-img {
                width:800px;
                height:130px;
                opacity: 0; /* 最初は透明 */
                animation: fadeInOut 3s ease-in-out forwards;
            }

            @keyframes fadeInOut {
            0%   { opacity: 0; transform: scale(0.8); }
            30%  { opacity: 1; transform: scale(1); }
            60%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to   { opacity: 1; }
            }

        </style>

        <script>
            // 3秒後に /home/ へリダイレクト
            setTimeout(function() {
                window.location.href = "/home/";
            }, 3000);
        </script>
    </head>

    <body>
        <img src="{% static 'images/logo_white.png' %}" class="fade-in-img">
    </body>

</html>
