{% extends 'base.html' %}
{% block title %}ミーティング管理{% endblock %}

{% block content %}

    <!-- 中央寄せ用ラッパー -->
    <div style="max-width: 1000px; margin: 0 auto;">

        <div class="text-center mb-5">
            <h2><strong>ミーティング管理</strong></h2>
        </div>

        <div style="max-width: 1000px; margin: 0 auto;" class="mb-4 text-end">
            <a href="{% url 'meeting:create' %}" class="btn btn-layout btn-create">
                <i class="fas fa-plus-circle"></i> 新規登録
            </a>
        </div>

        <table class="mb-5 mx-auto" style="width: 100%;">
            <thead class="">
                <tr>
                    <th width="260">実施日時</th>
                    <th width="320">ミーティング名</th>
                    <th width="100">詳細</th>
                    <th width="100">編集</th>
                    <th width="100">削除</th>
                    <th width="120">議事更新通知</th>
                </tr>
            </thead>
            <tbody>
                {% for item in object_list %}
                    <tr class="task-row" data-status="{{ item.status }}">
                        <td class="">{{ item.datetime|date:"Y年n月j日(D) G:i" }}～</td>
                        <td class="">{{ item.name }}</td>
                        <td class="text-center">
                            <a href="{% url 'meeting:detail' item.id %}">
                                <button class="btn btn-layout-small btn-detail"><i class="fa-solid fa-list"></i> 詳細</button>
                            </a>
                        </td>
                        <td class="text-center">
                            <a href="{% url 'meeting:edit' item.id %}">
                                <button class="btn btn-layout-small btn-edit"><i class="fa-solid fa-pen"></i> 編集</button>
                            </a>
                        </td>
                        <td class="text-center">
                            <a href="#" onclick="confirmDelete('{{ item.id }}', this.dataset.url, '{{ item.name }}'); return false;" 
                                data-url="/meeting/{{ item.id }}/delete/">
                                <button class="btn btn-layout-small btn-delete"><i class="fa-solid fa-trash"></i> 削除</button>
                            </a>
                        </td>        
                        <td class="text-center">
                            <a href="{% url 'meeting:notification' item.id %}">
                                <button class="btn btn-layout-small btn-notification"><i class="fa-solid fa-paper-plane"></i> 送信</button>
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="text-center mb-5">
            <a href="{% url 'home:index' %}" class="btn btn-secondary btn-layout">
                ホーム画面に戻る <i class="fa-solid fa-circle-chevron-right"></i>
            </a>
        </div>

    </div>

    <!-- 削除確認モーダル -->
    <div id="confirm-dialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: #fff; border: 1px solid #ccc; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 1000; width: 700px; font-size: 24px; margin:0px auto; text-align: center;">
        <p id="confirm-message">ミーティングを削除しますか？</p>
        <button class="btn btn-primary btn-layout" style="width: 100px; font-size:20px;" onclick="proceedDelete()">Yes</button>
        <button class="btn btn-danger btn-layout" style="width: 100px; font-size:20px; margin-left:20px;" onclick="cancelDelete()">No</button>
    </div>

    <!-- モーダル表示時の背景 -->
    <div id="overlay" style="display: none; position: fixed; top: 0; left: 0;
        width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999;">
    </div>

{% endblock content %}
