{% extends 'base.html' %}
{% load static %}
{% block title %}ナレッジ詳細{% endblock %}

{% block content %}

    <div class="text-center mb-5">
        <h2><strong>ナレッジ詳細</strong></h2>
    </div>

    <div class="container-fluid content-area">

        <div class="mb-5">

            <div class="row mb-4">
                <div class="col-md-2"></div>
                <div class="col-md-1">
                    タイトル
                </div>
                <div class="col-md-7">
                    <div class="d-flex gap-2">
                        {{ object.title }}
                    </div>
                </div>

                <div class="col-md-2"></div>
            </div>
            <div class="knowledge-detail-line mb-4"></div>

            <div class="row mb-4">
                <div class="col-md-2"></div>
                <div class="col-md-1">
                    作成者
                </div>
                <div class="col-md-7">
                    {{ object.created_by }}
                </div>
                <div class="col-md-2"></div>
            </div>
            <div class="knowledge-detail-line mb-4"></div>

            <div class="row mb-4">
                <div class="col-md-2"></div>
                <div class="col-md-1">
                    内容
                </div>
                <div class="col-md-7">
                    {{ object.content|linebreaks }}
                </div>
                <div class="col-md-2"></div>
            </div>
        </div>
    </div>

    <div class="text-center mb-5">
        <a href="{% url 'knowledge:index' %}" class="btn btn-secondary btn-layout">
            ナレッジ管理に戻る <i class="fa-solid fa-circle-chevron-right"></i>
        </a>
    </div>
    
{% endblock content %}
