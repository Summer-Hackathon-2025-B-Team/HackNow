services:

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    command: >
      sh -c "cd /app/app && 
            /wait-for-it.sh ${MYSQL_HOST:-db}:3306 --timeout=60 --strict -- 
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             exec gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - ./app:/app/app
    expose:
      - "8000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close(); sys.exit(0)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/staticfiles:/staticfiles:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      
    
